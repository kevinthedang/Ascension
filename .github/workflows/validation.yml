name: Validation

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Important Files Exist
        run: |
          test -f Ascension.csproj
          test -f Ascension.cs
          test -f build.txt
          test -f description.txt
          test -f description_workshop.txt

      - name: Verify Localization Files
        run: |
          find Localization -type f

      - name: Verify PNG Assets
        run: |
          find . -name "*.png" | while read file; do
            if [ ! -s "$file" ]; then
              echo "Empty PNG found: $file"
              exit 1
            fi
          done

      - name: Check for Merge Conflict Markers
        run: |
          if grep -R --include="*.cs" -n "<<<<<<<\|=======\|>>>>>>>" .; then
            echo "Merge conflict markers found"
            exit 1
          fi